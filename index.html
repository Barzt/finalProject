<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Home Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link rel="stylesheet" type="text/css" href="css/homePageStyle.css">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="flex-column-container-body">

  <div id="welcomeBack" class="welcome-notification">
      ברוך שובך! 🌙 החלום שלך נשמר במערכת בהצלחה.
  </div>

  <header class="flex-container-header">
    <div class="header-links">
      <span class="header-user">
        <svg class="user-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
        </svg>
        <span>שלום, נעמה</span>
      </span>
      <a href="#" class="logout-link">
        <svg class="logout-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"></path>
          <path d="M14 16l4-4-4-4"></path>
          <path d="M8 12h10"></path>
        </svg>
        <span>יציאה</span>
      </a>
    </div>

    <div class="header-logo">
      REMORY
    </div>
  </header>

  <nav class="flex-container-nav">
    <a href="index.html" class="is-active">דף הבית</a>
    <a href="includes/form.html">שחזור חלום</a>
    <a href="includes/myDreams.html">החלומות שלי</a>
    <a href="includes/dreamPatterns.html">דפוסי חלום</a>
    <a href="includes/dreamInfo.html">על חלומות וזיכרון</a>
  </nav>

  <div class="flex-containr-main-and-aside-plus-stretch">

    <main class="flex-container-main-plus-stretch">

        <section class="flex-column-container-sections-plus-stretch">

          <section class="container-section-blue">
            <img src="images/remoryLogo1.jpg" alt="our logo">    
          </section>

          <section class="flex-wrap-container-offers-sections">

            <div class="flex-container-offer-section">
              <article class="container-artice">
                <img src="images/dream.jpg" alt="חלום מופשט בגווני כחול">
                <a href="includes/form.html">שחזר את החלום שלך</a>
              </article>

              <article class="container-artice">
                <img src="images/airBaloon.jpg" alt="כדור פורח מעל עננים">
                <a href="includes/myDreams.html">החלומות שלי</a>
              </article>
            </div>

            <div class="flex-container-offer-section">
              <article class="container-artice">
                <img src="images/wheel.jpg" alt="גלגל מסתובב כסמל למחזוריות">
                <a href="includes/dreamPatterns.html">דפוסי חלום</a>
              </article>

              <article class="container-artice">
                <img src="images/clouds.jpg" alt="עננים רכים בשמיים">
                <a href="includes/dreamInfo.html">על חלומות וזיכרון</a>
              </article>
            </div>

          </section>
        </section>
    </main>

  </div>

  <footer class="flex-container-footer index-footer">
    <a href="#">קצת עלינו</a>
    <a href="#"> תנאי שימוש </a>
    <a href="#"> מדיניות פרטיות</a>
  </footer>

  <script>
    $(document).ready(function() {
        // Check if the user came from the success page and show the welcome back message with animations
        if (document.referrer.includes("success.html")) {
            // Show the welcome back message with a slide down, then fade out after a delay
            $("#welcomeBack").slideDown(600).delay(4000).fadeOut(1000);
        }
    });
  </script>

</body>
</html>
