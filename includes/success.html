<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>החלום נשמר!</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/formStyle.css">
    <style>
        .success-container {
            text-align: center;
            margin-top: 100px;
            animation: fadeIn 1.5s ease-in-out;
        }
        .cloud-emoji {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #countdown { font-weight: bold; color: #5c7cfa; }
    </style>
</head>
<body class="flex-column-container-body">
    <div class="success-container">
        <span class="cloud-emoji">☁️</span>
        <h1>תודה שמילאת את החלום!</h1>
        <p>אנחנו מעבדים אותו עכשיו בתוך מאגר הזיכרונות של REMORY...</p>
        <p>עוד <span id="countdown">5</span> שניות תועברו חזרה לדף הבית.</p>
    </div>

    <script>
        // Countdown timer and redirect to home page
        let seconds = 5;
        const countdownElement = document.getElementById("countdown");

        const interval = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = "../index.html";
            }
        }, 1000);
    </script>
</body>
</html>
