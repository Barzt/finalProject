<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>שחזור חלום</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/formStyle.css">
    <script defer src="../js/dreamForm.js"></script>
</head>

<body class="flex-column-container-body">
    <header class="flex-container-header">
        <div class="header-links">
            <span class="header-user">
                <svg class="user-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
                </svg>
                <span>שלום, נעמה</span>
            </span>
            <a href="#" class="logout-link">
                <svg class="logout-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                    <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"></path>
                    <path d="M14 16l4-4-4-4"></path>
                    <path d="M8 12h10"></path>
                </svg>
                <span>יציאה</span>
            </a>
        </div>
        <div class="header-logo">REMORY</div>
    </header>

    <nav class="flex-container-nav">
        <a href="../index.html">דף הבית</a>
        <a href="form.html" class="is-active">שחזור חלום</a>
        <a href="myDreams.html">החלומות שלי</a>
        <a href="dreamPatterns.html">דפוסי חלום</a>
        <a href="dreamInfo.html">על חלומות וזיכרון</a>
    </nav>

    <main>
        <section class="form-section">
            <h2 id="header2">ספר/י לנו על החלום שלך</h2>
            <form id="dreamForm" action="saveDream.php" method="POST" onsubmit="return validateForm(event)">
                
                <label for="dreamDate">תאריך החלום:</label>
                <input type="date" id="dreamDate" name="dreamDate" required>

                <fieldset>
                    <legend>תגיות לחלום (בחרו לפחות 2):</legend>
                    <br>
                    <label><input type="checkbox" name="dreamTags[]" value="טיסה"> טיסה </label>
                    <label><input type="checkbox" name="dreamTags[]" value="מים"> מים </label>
                    <label><input type="checkbox" name="dreamTags[]" value="אנשים"> אנשים </label>
                    <label><input type="checkbox" name="dreamTags[]" value="חיות"> חיות </label>
                    <label><input type="checkbox" name="dreamTags[]" value="תאונות"> תאונות </label>
                    <label><input type="checkbox" name="dreamTags[]" value="נפילה"> נפילה </label>   
                    <label><input type="checkbox" name="dreamTags[]" value="אחר"> אחר </label>
                </fieldset>

                <label for="dreamLucidity">מדד בהירות החלום:</label>
                <input type="range" id="dreamLucidity" name="dreamLucidity" min="1" max="5" value="3">
                <div id="lucidityValue">רמה: 3</div>

                <label for="wakeTime">שעת יקיצה:</label>
                <input type="time" id="wakeTime" name="wakeTime" required>

                <label for="dreamDescription">תיאור החלום:</label>
                <textarea id="dreamDescription" name="dreamDescription" placeholder="מינימום 20 תווים..."></textarea>

                <button type="submit">שמור חלום</button>
            </form>
        </section>
    </main>

    <footer class="flex-container-footer">
        <a href="#">קצת עלינו</a>
        <a href="#"> תנאי שימוש </a>
        <a href="#"> מדיניות פרטיות</a>
    </footer>
</body>
</html>
